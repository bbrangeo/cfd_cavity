[package]
name = "cavity_les"
version = "0.1.0"
edition = "2024"

[dependencies]
oxiphysics-lbm = "0.1.2"
rayon = "1.10"
# Backend GPU (Étape A, porte G1) : compute WGSL, Metal natif sur Apple Silicon.
wgpu = "30"
# block_on pour l'initialisation asynchrone de l'adapter/device wgpu.
pollster = "0.4"
# Conversion Pod/Zeroable des paramètres uniformes vers les buffers GPU.
bytemuck = { version = "1", features = ["derive"] }
